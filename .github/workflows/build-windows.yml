name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Create artifact
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').ToString().Split('+')[0].Replace('version: ', '').Trim()
          $artifactName = "psclips-v$version.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $artifactName
          echo "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: psclips-windows
          path: ${{ env.ARTIFACT_NAME }}